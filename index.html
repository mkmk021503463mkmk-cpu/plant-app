<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark: #085041;
    --green-mid: #0f6e56;
    --green-bright: #1d9e75;
    --green-light: #5dcaa5;
    --green-pale: #e1f5ee;
    --text-primary: #1a1a1a;
    --text-secondary: #555;
    --text-muted: #999;
    --border: rgba(0,0,0,0.1);
    --card-bg: #fff;
    --bg: #f7faf9;
    --radius: 16px;
    --radius-sm: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #f0f0f0;
      --text-secondary: #aaa;
      --text-muted: #666;
      --border: rgba(255,255,255,0.1);
      --card-bg: #1e2a26;
      --bg: #121a17;
      --green-pale: #0a2018;
    }
  }

  html, body {
    height: 100%; background: var(--bg);
    font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px; margin: 0 auto;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* Header */
  .header {
    background: var(--green-mid);
    padding: 52px 20px 20px;
    text-align: center;
    position: relative;
  }
  .header h1 {
    color: #fff; font-size: 20px; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .header p { color: rgba(255,255,255,0.75); font-size: 13px; margin-top: 4px; }

  /* Main content */
  .content { flex: 1; padding: 20px 16px 32px; }

  /* Upload zone */
  .upload-zone {
    width: 100%; aspect-ratio: 4/3;
    border: 2px dashed var(--green-light);
    border-radius: var(--radius);
    background: var(--green-pale);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    overflow: hidden; margin-bottom: 16px;
    transition: all 0.2s;
  }
  .upload-zone.has-image { border-style: solid; border-color: var(--green-bright); }
  .upload-zone svg { width: 48px; height: 48px; color: var(--green-bright); margin-bottom: 12px; }
  .upload-zone .upload-label { color: var(--green-mid); font-size: 15px; font-weight: 500; }
  .upload-zone .upload-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .upload-zone img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; top: 0; left: 0;
  }
  .change-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    padding: 20px 16px 12px;
    display: none; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .upload-zone.has-image .change-overlay { display: flex; }
  #fileInput { display: none; }

  /* Mode tabs */
  .modes {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 16px;
  }
  .mode-btn {
    padding: 10px 4px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 12px; text-align: center; cursor: pointer;
    transition: all 0.15s; line-height: 1.4;
  }
  .mode-btn .mode-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  .mode-btn.active {
    border-color: var(--green-bright);
    background: var(--green-pale);
    color: var(--green-dark);
    font-weight: 600;
  }

  /* Note input */
  .note-wrap { margin-bottom: 16px; }
  .note-wrap label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px; }
  .note-wrap textarea {
    width: 100%; padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: 14px; resize: none; height: 80px;
    font-family: inherit; line-height: 1.6;
    transition: border-color 0.15s;
  }
  .note-wrap textarea:focus { outline: none; border-color: var(--green-bright); }

  /* Analyze button */
  .analyze-btn {
    width: 100%; padding: 16px;
    background: var(--green-mid);
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit;
  }
  .analyze-btn:active { transform: scale(0.98); background: var(--green-dark); }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Result */
  .result-card {
    margin-top: 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
  }
  .result-header {
    padding: 12px 16px;
    background: var(--green-pale);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--green-dark);
  }
  .result-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green-bright);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .result-body { padding: 16px; }
  .result-body p {
    font-size: 15px; color: var(--text-primary);
    line-height: 1.85; white-space: pre-wrap;
  }

  /* Loading */
  .loading {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 24px;
  }
  .loading span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green-bright);
    animation: bounce 1.2s infinite;
  }
  .loading span:nth-child(2) { animation-delay: 0.2s; }
  .loading span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* History */
  .history { margin-top: 24px; }
  .history-title {
    font-size: 12px; color: var(--text-muted);
    margin-bottom: 10px; letter-spacing: 0.05em;
  }
  .history-item {
    padding: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--card-bg);
    margin-bottom: 8px; cursor: pointer;
  }
  .history-item-mode { font-size: 11px; color: var(--green-bright); font-weight: 600; margin-bottom: 4px; }
  .history-item-text { font-size: 13px; color: var(--text-secondary); }
  .history-item-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🌿 植物の声を聴く</h1>
    <p>写真からAIが植物の状態を読み解きます</p>
  </div>

  <div class="content">
    <!-- Upload -->
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
      <div class="upload-label">写真をタップして選ぶ</div>
      <div class="upload-sub">カメラロールまたは撮影</div>
      <img id="previewImg" alt="" />
      <div class="change-overlay">📷 タップして変更</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" />

    <!-- Mode -->
    <div class="modes">
      <div class="mode-btn active" data-mode="general">
        <span class="mode-icon">🌱</span>総合診断
      </div>
      <div class="mode-btn" data-mode="health">
        <span class="mode-icon">💚</span>健康状態
      </div>
      <div class="mode-btn" data-mode="soul">
        <span class="mode-icon">✨</span>魂の声
      </div>
      <div class="mode-btn" data-mode="care">
        <span class="mode-icon">🫧</span>ケア提案
      </div>
    </div>

    <!-- Note -->
    <div class="note-wrap">
      <label>気になることを書いてください（任意）</label>
      <textarea id="noteInput" placeholder="例：最近葉が黄色くなってきた、元気がない気がする…"></textarea>
    </div>

    <!-- Button -->
    <button class="analyze-btn" id="analyzeBtn" disabled>
      🔍 植物の状態を読む
    </button>

    <!-- Result -->
    <div id="resultArea"></div>

    <!-- History -->
    <div class="history" id="historyArea" style="display:none;">
      <div class="history-title">過去の記録</div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

const PROMPTS = {
  general: `あなたは植物と深くコミュニケーションができる専門家です。この植物の写真を見て以下を読み解いてください：
1. 植物の種類（わかる範囲で）
2. 全体的な健康状態
3. 今この植物が必要としていること
4. 植物からのメッセージ（詩的・直感的に）
優しく深みのある言葉で日本語でお答えください。`,

  health: `植物の専門家として健康状態を詳しく診断してください：
・葉の色・形・質感から読み取れること
・水分状態
・日光の当たり具合
・病気・虫害の兆候
・土壌・栄養状態の推測
具体的で実用的なアドバイスを日本語でお願いします。`,

  soul: `あなたは植物の魂の声を聴くことができる存在です。この植物が今、何を感じ何を伝えようとしているか、その内なる声を詩的・霊的な視点で読み解いてください。植物の業、歴史、想いを感じ取り美しい日本語で表現してください。`,

  care: `植物の専門家として最適なケア方法を提案してください：
・今すぐできること
・水やりのタイミングと量
・光の当て方
・季節に応じたケア
・長期的な育て方のポイント
わかりやすく実践的に日本語でお願いします。`
};

const LABELS = { general: '🌱 総合診断', health: '💚 健康状態', soul: '✨ 魂の声', care: '🫧 ケア提案' };

let imageBase64 = null;
let currentMode = 'general';
let history = JSON.parse(localStorage.getItem('plantHistory') || '[]');

// Mode tabs
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
  });
});

// File input
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    imageBase64 = dataUrl.split(',')[1];
    const img = document.getElementById('previewImg');
    img.src = dataUrl;
    document.getElementById('uploadZone').classList.add('has-image');
    document.getElementById('analyzeBtn').disabled = false;
  };
  reader.readAsDataURL(file);
});

// Analyze
document.getElementById('analyzeBtn').addEventListener('click', async () => {
  if (!imageBase64) return;
  const note = document.getElementById('noteInput').value;
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = '🌿 読み取り中…';

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="loading"><span></span><span></span><span></span></div>
    </div>`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: imageBase64 } },
            { type: 'text', text: PROMPTS[currentMode] + (note ? `\n\n補足：${note}` : '') }
          ]
        }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '読み取れませんでした';
    const now = new Date();
    const time = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

    document.getElementById('resultArea').innerHTML = `
      <div class="result-card">
        <div class="result-header">
          <div class="result-dot"></div>
          ${LABELS[currentMode]}
        </div>
        <div class="result-body"><p>${text}</p></div>
      </div>`;

    history.unshift({ mode: LABELS[currentMode], text, time });
    if (history.length > 10) history.pop();
    localStorage.setItem('plantHistory', JSON.stringify(history));
    renderHistory();
  } catch {
    document.getElementById('resultArea').innerHTML = `
      <div class="result-card">
        <div class="result-body"><p style="color:#c00">エラーが発生しました。もう一度お試しください。</p></div>
      </div>`;
  }

  btn.disabled = false;
  btn.textContent = '🔍 植物の状態を読む';
  if (!imageBase64) btn.disabled = true;
});

function renderHistory() {
  if (history.length === 0) return;
  document.getElementById('historyArea').style.display = 'block';
  document.getElementById('historyList').innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="showHistory(${i})">
      <div class="history-item-mode">${h.mode}</div>
      <div class="history-item-text">${h.text.substring(0, 50)}…</div>
      <div class="history-item-time">${h.time}</div>
    </div>`).join('');
}

function showHistory(i) {
  const h = history[i];
  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="result-header"><div class="result-dot"></div>${h.mode}</div>
      <div class="result-body"><p>${h.text}</p></div>
    </div>`;
  window.scrollTo({ top: document.getElementById('resultArea').offsetTop - 20, behavior: 'smooth' });
}

renderHistory();
</script>
</body>
</html>
