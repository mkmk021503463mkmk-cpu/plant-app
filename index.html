mQa+vb3iaBpnCL5KwACI+StD7u0seSpAt/CIJj0Bz2kcijS/taR+JMga/STkBpjSngdY3VjWnQebwixSYAFOjpoHlV7VHTYPswW9KvMkle8vg8f8T9pahSuinyr3hJVvL4DH0a7aWoWLop0q/+WMub29cPVPYI8o/qGhjUTaKWAZCfxwLdAbPZSD0p2GxOrAsBIHfh8UbrEc5CDkAAAAAAAAAAAAAAAAAAAAAAAAAAP8CVkkydP7yN5cAAAAASUVORK5CYII=">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a1628;--surface:#111d35;--surface2:#1a2a45;
  --green:#1d9e75;--green-light:#5dcaa5;--green-pale:rgba(29,158,117,0.12);
  --amber:#e8a838;--amber-pale:rgba(232,168,56,0.12);
  --blue:#4a9eff;--blue-pale:rgba(74,158,255,0.12);
  --text:#e8edf5;--text2:#8a9ab8;--text3:#4a5a78;
  --border:rgba(255,255,255,0.07);--radius:14px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(29,158,117,0.08) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(93,202,165,0.05) 0%,transparent 50%);
  pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.header{padding:52px 20px 20px;text-align:center}
.header-icon{font-size:28px;margin-bottom:8px}
.header h1{font-size:20px;font-weight:300;letter-spacing:0.15em;margin-bottom:4px}
.header p{font-size:11px;color:var(--text2);letter-spacing:0.1em;font-family:'Space Mono',monospace}

.nav{display:flex;border-bottom:1px solid var(--border);margin:0 20px}
.nav-btn{flex:1;padding:12px 6px;font-size:11px;color:var(--text2);background:none;border:none;
  cursor:pointer;font-family:'Space Mono',monospace;letter-spacing:0.04em;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s}
.nav-btn.active{color:var(--green-light);border-bottom-color:var(--green-light)}

.content{flex:1;padding:20px;overflow-y:auto}
.page{display:none}.page.active{display:block}

/* Upload */
.upload-zone{width:100%;aspect-ratio:4/3;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;margin-bottom:14px;transition:border-color 0.2s;}
.upload-zone:hover{border-color:var(--green)}
.upload-zone.has-image{border-color:var(--green)}
.upload-zone svg{width:36px;height:36px;color:var(--text3);margin-bottom:8px}
.upload-text{font-size:13px;color:var(--text2)}
.upload-zone img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.change-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);
  color:#fff;font-size:12px;padding:8px;text-align:center;display:none;font-family:'Space Mono',monospace}
.upload-zone.has-image .change-bar{display:block}
#fileInput{display:none}

/* Mode grid */
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.mode-card{padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;transition:all 0.15s;}
.mode-card.active{border-color:var(--green);background:var(--green-pale)}
.mode-card .mc-icon{font-size:18px;margin-bottom:4px}
.mode-card .mc-name{font-size:12px;font-weight:500;color:var(--text);font-family:'Space Mono',monospace;margin-bottom:2px}
.mode-card .mc-desc{font-size:11px;color:var(--text2);line-height:1.3}

/* Note */
.note-label{font-size:11px;color:var(--text2);margin-bottom:6px;display:block;
  letter-spacing:0.05em;font-family:'Space Mono',monospace}
.note-input{width:100%;padding:10px 12px;margin-bottom:14px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);
  font-size:13px;font-family:'Noto Serif JP',serif;resize:none;height:72px;line-height:1.6;
  transition:border-color 0.2s;}
.note-input:focus{outline:none;border-color:var(--green)}

/* === 精度選択 === */
.precision-label{font-size:11px;color:var(--text2);margin-bottom:8px;display:block;
  letter-spacing:0.05em;font-family:'Space Mono',monospace}
.precision-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.precision-card{
  padding:12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;transition:all 0.2s;text-align:center;
}
.precision-card.mode-local.active{border-color:var(--amber);background:var(--amber-pale)}
.precision-card.mode-claude.active{border-color:var(--blue);background:var(--blue-pale)}
.precision-card .pc-icon{font-size:22px;margin-bottom:6px}
.precision-card .pc-name{font-size:12px;font-weight:500;font-family:'Space Mono',monospace;margin-bottom:3px}
.precision-card.mode-local .pc-name{color:var(--amber)}
.precision-card.mode-claude .pc-name{color:var(--blue)}
.precision-card .pc-desc{font-size:11px;color:var(--text2);line-height:1.4}
.precision-card .pc-badge{
  display:inline-block;margin-top:6px;padding:2px 8px;border-radius:100px;
  font-size:10px;font-family:'Space Mono',monospace;
}
.precision-card.mode-local .pc-badge{background:var(--amber-pale);color:var(--amber)}
.precision-card.mode-claude .pc-badge{background:var(--blue-pale);color:var(--blue)}

/* Action btn */
.action-btn{
  width:100%;padding:15px;border:none;border-radius:var(--radius);
  font-size:14px;font-family:'Space Mono',monospace;letter-spacing:0.06em;
  cursor:pointer;transition:all 0.2s;margin-bottom:4px;
}
.action-btn:disabled{opacity:0.35;cursor:not-allowed}
.action-btn.local{background:linear-gradient(135deg,var(--amber),#c47e10);color:#fff}
.action-btn.claude{background:linear-gradient(135deg,var(--blue),#1a6dd4);color:#fff}
.action-btn:active{transform:scale(0.98)}

/* Result */
.result-box{margin-top:14px;border-radius:var(--radius);overflow:hidden;display:none}
.result-header{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:11px;
  font-family:'Space Mono',monospace;letter-spacing:0.08em}
.result-header.local{background:var(--amber-pale);color:var(--amber);border:1px solid rgba(232,168,56,0.2)}
.result-header.claude{background:var(--blue-pale);color:var(--blue);border:1px solid rgba(74,158,255,0.2)}
.result-body{padding:14px;border:1px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius) var(--radius);background:var(--surface)}
.result-text{font-size:14px;color:var(--text);line-height:1.85;white-space:pre-wrap}
.result-actions{display:flex;gap:8px;margin-top:12px}
.r-btn{flex:1;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:none;color:var(--text2);font-size:11px;font-family:'Space Mono',monospace;
  cursor:pointer;transition:all 0.15s;}
.r-btn:hover{border-color:var(--green);color:var(--green-light)}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;gap:6px;padding:20px}
.loading span{width:6px;height:6px;border-radius:50%;background:var(--green-light);
  animation:bounce 1.2s infinite}
.loading span:nth-child(2){animation-delay:0.2s}
.loading span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Rules page */
.rules-header{margin-bottom:16px}
.rules-header h2{font-size:15px;font-weight:300;letter-spacing:0.1em;margin-bottom:4px}
.rules-header p{font-size:12px;color:var(--text2)}
.rule-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;}
.rule-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rule-name{font-size:12px;font-weight:500;color:var(--text);font-family:'Space Mono',monospace}
.rule-toggle{position:relative;width:40px;height:22px;background:var(--text3);border-radius:11px;
  cursor:pointer;transition:background 0.2s;border:none;flex-shrink:0;}
.rule-toggle.on{background:var(--green)}
.rule-toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:transform 0.2s;}
.rule-toggle.on::after{transform:translateX(18px)}
.rule-desc{font-size:11px;color:var(--text2);line-height:1.4;margin-bottom:8px}
.rule-textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:12px;font-family:'Noto Serif JP',serif;
  resize:none;line-height:1.6;transition:border-color 0.2s;}
.rule-textarea:focus{outline:none;border-color:var(--green)}
.rule-textarea:disabled{opacity:0.35;cursor:not-allowed}

/* Local answers editor */
.local-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.local-section h3{font-size:13px;font-weight:500;color:var(--amber);font-family:'Space Mono',monospace;
  letter-spacing:0.08em;margin-bottom:4px}
.local-section p{font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.local-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;}
.local-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.local-icon{font-size:16px}
.local-name{font-size:12px;font-weight:500;color:var(--text);font-family:'Space Mono',monospace}

.add-rule-btn{width:100%;padding:12px;border:1px dashed var(--border);border-radius:var(--radius);
  background:none;color:var(--text2);font-size:12px;font-family:'Space Mono',monospace;
  cursor:pointer;letter-spacing:0.05em;transition:all 0.2s;margin-bottom:10px;}
.add-rule-btn:hover{border-color:var(--green);color:var(--green-light)}
.save-btn{width:100%;padding:13px;border:1px solid var(--green);border-radius:var(--radius);
  background:none;color:var(--green-light);font-size:12px;font-family:'Space Mono',monospace;
  letter-spacing:0.08em;cursor:pointer;transition:all 0.2s;}
.save-btn:hover{background:var(--green-pale)}

/* Logs */
.log-empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.log-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color 0.2s;}
.log-item:hover{border-color:var(--text3)}
.log-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.log-mode{font-size:11px;font-family:'Space Mono',monospace}
.log-mode.local{color:var(--amber)}
.log-mode.claude{color:var(--blue)}
.log-time{font-size:10px;color:var(--text3);font-family:'Space Mono',monospace}
.log-preview{font-size:12px;color:var(--text2);line-height:1.4}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green);color:#fff;padding:10px 20px;border-radius:100px;
  font-size:12px;font-family:'Space Mono',monospace;opacity:0;transition:all 0.3s;
  pointer-events:none;z-index:100;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-icon">🌿</div>
    <h1>AI 診 断 ツ ー ル</h1>
    <p>PLANT · NATURE · SOUL READER</p>
  </div>

  <div class="nav">
    <button class="nav-btn active" data-page="diagnose">診断</button>
    <button class="nav-btn" data-page="rules">AIルール</button>
    <button class="nav-btn" data-page="logs">記録</button>
  </div>

  <div class="content">

    <!-- 診断ページ -->
    <div class="page active" id="page-diagnose">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <div class="upload-text">写真をタップして選ぶ</div>
        <img id="previewImg" alt=""/>
        <div class="change-bar">📷 タップして変更</div>
      </div>
      <input type="file" id="fileInput" accept="image/*"/>

      <div class="mode-grid" id="modeGrid"></div>

      <label class="note-label">気になること（任意）</label>
      <textarea class="note-input" id="noteInput" placeholder="例：最近葉が黄色くなってきた…"></textarea>

      <!-- 精度選択 -->
      <label class="precision-label">▸ 回答モードを選ぶ</label>
      <div class="precision-grid">
        <div class="precision-card mode-local active" data-precision="local">
          <div class="pc-icon">⚡</div>
          <div class="pc-name">かんたん回答</div>
          <div class="pc-desc">ルール設定をもとにすぐ答えます</div>
          <div class="pc-badge">オフライン対応</div>
        </div>
        <div class="precision-card mode-claude" data-precision="claude">
          <div class="pc-icon">🤖</div>
          <div class="pc-name">Claude連携</div>
          <div class="pc-desc">AIが写真を見て詳しく分析します</div>
          <div class="pc-badge">高精度</div>
        </div>
      </div>

      <button class="action-btn local" id="actionBtn" disabled>⚡ かんたん診断する</button>

      <div class="result-box" id="resultBox">
        <div class="result-header local" id="resultHeader">▸ LOCAL ANSWER</div>
        <div class="result-body">
          <div class="result-text" id="resultText"></div>
          <div class="result-actions">
            <button class="r-btn" id="switchToClaudeBtn">🤖 Claudeでより詳しく →</button>
            <button class="r-btn" id="saveLogBtn">📝 記録に保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- AIルールページ -->
    <div class="page" id="page-rules">
      <div class="rules-header">
        <h2>AI ルール設定</h2>
        <p>Claudeへの指示・かんたん回答の内容を設定します</p>
      </div>
      <div id="rulesContainer"></div>
      <button class="add-rule-btn" id="addRuleBtn">＋ ルールを追加</button>

      <div class="local-section">
        <h3>⚡ かんたん回答の設定</h3>
        <p>モードごとにオフラインで表示する定型回答を設定できます。写真が不要な基本情報に使います。</p>
        <div id="localAnswersContainer"></div>
      </div>

      <button class="save-btn" id="saveRulesBtn">✓ 設定を保存</button>
    </div>

    <!-- 記録ページ -->
    <div class="page" id="page-logs">
      <div id="logsContainer"></div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const MODES_DEFAULT = [
  {id:'general',name:'総合診断',icon:'🌱',desc:'種類・状態・メッセージ',
    prompt:'この植物の種類・健康状態・必要なこと・植物からのメッセージを総合的に読み解いてください。',
    localAnswer:'【総合診断】\n\n植物の状態を確認するには:\n・葉の色が均一で鮮やかか\n・茎がしっかり立っているか\n・新芽が出ているか\n\nより詳しい診断はClaudeに写真を送ってください。'},
  {id:'health',name:'健康状態',icon:'💚',desc:'病気・栄養・水分',
    prompt:'この植物の健康状態を詳しく診断してください。葉の色・水分・日光・病気の兆候を見てください。',
    localAnswer:'【健康チェックリスト】\n\n✓ 水分：土を指で触って乾いていたら水やりのサイン\n✓ 日光：1日6時間以上の明るい場所が理想\n✓ 栄養：葉が黄色→窒素不足、紫色→リン不足の可能性\n✓ 病害虫：葉の裏を確認\n\n写真をClaudeに送ると詳しく診断できます。'},
  {id:'soul',name:'魂の声',icon:'✨',desc:'詩的・霊的な視点',
    prompt:'この植物が今何を感じ伝えようとしているか、魂の声を詩的・霊的な視点で読み解いてください。',
    localAnswer:'【植物の魂について】\n\n植物は言葉を持たないが、その存在そのもので語りかけている。\n\n根は大地への信頼、\n葉は光への渇望、\n花は純粋な喜びの表現。\n\nあなたの植物が今何を語っているか、\nClaudeに写真を送ると読み解きます。'},
  {id:'care',name:'ケア提案',icon:'🫧',desc:'今すぐできるケア',
    prompt:'この植物に最適なケア方法を提案してください。水やり・光・季節のケアなど実践的に。',
    localAnswer:'【基本のケア】\n\n💧 水やり：土の表面が乾いたら\n☀️ 日光：明るい窓辺（直射日光は避ける）\n🌡️ 温度：15〜25℃が多くの植物に適切\n✂️ 剪定：枯れた葉はすぐに取り除く\n🪴 植え替え：根が鉢底から出たらサイン\n\n植物の種類に合わせた詳細はClaudeへ。'},
  {id:'history',name:'植物の歴史',icon:'📜',desc:'起源と文化的意味',
    prompt:'この植物の種類を特定し、起源・歴史・文化的な意味・人類との関わりを教えてください。',
    localAnswer:'【植物と人類の歴史】\n\n植物は人類の歴史とともに歩んできた。\n薬として、食料として、精神的なシンボルとして。\n\n写真をClaudeに送ると、この植物の具体的な歴史と文化的背景を詳しく教えてもらえます。'},
  {id:'ecosystem',name:'生態系',icon:'🌍',desc:'自然界での役割',
    prompt:'この植物の生態系での役割、他の生物との関係、環境への影響について教えてください。',
    localAnswer:'【植物と生態系】\n\n植物は生態系の基盤。\n・光合成で酸素を生み出す\n・昆虫・鳥・動物の食料と住処\n・土壌を守り水を蓄える\n・他の植物と地下ネットワークで交信\n\nこの植物の具体的な役割はClaudeに写真を送ると詳しく分析できます。'}
];

const RULES_DEFAULT = [
  {id:'tone',name:'話し方のトーン',desc:'Claudeの返答スタイルを設定します',enabled:true,prompt:'優しく詩的な言葉で、深みのある文章で答えてください。'},
  {id:'length',name:'返答の長さ',desc:'詳しく・簡潔にを選べます',enabled:true,prompt:'300〜500文字程度で詳しく答えてください。'},
  {id:'lang',name:'言語スタイル',desc:'専門的・やさしいなど',enabled:true,prompt:'誰でもわかりやすい言葉で説明してください。'},
  {id:'spiritual',name:'スピリチュアル視点',desc:'魂・業・因果の観点を加える',enabled:false,prompt:'植物の持つ魂的・スピリチュアルな側面も含めて答えてください。'},
  {id:'science',name:'科学的視点',desc:'学術的な情報も加える',enabled:false,prompt:'植物学的・生態学的な科学的知見も交えて答えてください。'},
  {id:'custom',name:'カスタムルール',desc:'自由に指示を追加できます',enabled:false,prompt:''}
];

let modes = JSON.parse(localStorage.getItem('modes')||'null')||MODES_DEFAULT;
let rules = JSON.parse(localStorage.getItem('rules')||'null')||RULES_DEFAULT;
let logs = JSON.parse(localStorage.getItem('logs')||'[]');
let currentMode = modes[0].id;
let currentPrecision = 'local';
let imageReady = false;
let lastResult = null;

// Nav
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
    if(btn.dataset.page==='logs') renderLogs();
  });
});

// Modes
function renderModes(){
  const grid=document.getElementById('modeGrid');
  grid.innerHTML=modes.map(m=>`
    <div class="mode-card ${m.id===currentMode?'active':''}" data-id="${m.id}">
      <div class="mc-icon">${m.icon}</div>
      <div class="mc-name">${m.name}</div>
      <div class="mc-desc">${m.desc}</div>
    </div>`).join('');
  grid.querySelectorAll('.mode-card').forEach(c=>{
    c.addEventListener('click',()=>{currentMode=c.dataset.id;renderModes();});
  });
}
renderModes();

// Precision
document.querySelectorAll('.precision-card').forEach(card=>{
  card.addEventListener('click',()=>{
    document.querySelectorAll('.precision-card').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');
    currentPrecision=card.dataset.precision;
    const btn=document.getElementById('actionBtn');
    if(currentPrecision==='local'){
      btn.className='action-btn local';
      btn.textContent='⚡ かんたん診断する';
    } else {
      btn.className='action-btn claude';
      btn.textContent='🤖 Claude連携で診断する';
    }
    if(imageReady||currentPrecision==='local') btn.disabled=false;
  });
});

// Upload
document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    document.getElementById('previewImg').src=ev.target.result;
    document.getElementById('uploadZone').classList.add('has-image');
    imageReady=true;
    document.getElementById('actionBtn').disabled=false;
  };
  reader.readAsDataURL(file);
});

// Action btn
document.getElementById('actionBtn').addEventListener('click',()=>{
  if(currentPrecision==='local') runLocal();
  else runClaude();
});

function runLocal(){
  const mode=modes.find(m=>m.id===currentMode);
  const note=document.getElementById('noteInput').value;
  const activeRules=rules.filter(r=>r.enabled&&r.prompt).map(r=>r.prompt).join(' ');
  let answer=mode.localAnswer||'この診断モードのかんたん回答は設定されていません。\nAIルール設定から定型回答を入力してください。';
  if(note) answer+=`\n\n📝 メモ：${note}`;

  const box=document.getElementById('resultBox');
  const header=document.getElementById('resultHeader');
  const txt=document.getElementById('resultText');
  header.className='result-header local';
  header.textContent='⚡ かんたん回答';
  txt.textContent=answer;
  box.style.display='block';
  lastResult={mode:mode.name,type:'local',text:answer,time:new Date().toLocaleString('ja-JP')};
  document.getElementById('switchToClaudeBtn').style.display='';
}

function runClaude(){
  const mode=modes.find(m=>m.id===currentMode);
  const note=document.getElementById('noteInput').value;
  const activeRules=rules.filter(r=>r.enabled&&r.prompt).map(r=>r.prompt).join(' ');
  const prompt=[mode.prompt,activeRules,note?'気になること：'+note:''].filter(Boolean).join('\n\n');

  const box=document.getElementById('resultBox');
  const header=document.getElementById('resultHeader');
  const txt=document.getElementById('resultText');
  header.className='result-header claude';
  header.textContent='🤖 Claude連携 — メッセージを送信中…';
  txt.innerHTML='<div class="loading"><span></span><span></span><span></span></div>';
  box.style.display='block';
  document.getElementById('switchToClaudeBtn').style.display='none';
  lastResult={mode:mode.name,type:'claude',text:prompt,time:new Date().toLocaleString('ja-JP')};
  sendPrompt('【'+mode.name+'】\n\n'+prompt+(imageReady?'\n\n※植物の写真もこのチャットにアップロードしてください🌿':''));
  txt.textContent='Claudeにメッセージを送りました。\nこのチャット画面で回答を確認してください。\n\n'+(imageReady?'📷 写真もチャットにアップロードしてください。':'');
  header.textContent='🤖 Claude連携 — 送信完了';
}

// Switch to Claude
document.getElementById('switchToClaudeBtn').addEventListener('click',()=>{
  document.querySelectorAll('.precision-card').forEach(c=>c.classList.remove('active'));
  document.querySelector('.precision-card.mode-claude').classList.add('active');
  currentPrecision='claude';
  const btn=document.getElementById('actionBtn');
  btn.className='action-btn claude';
  btn.textContent='🤖 Claude連携で診断する';
  runClaude();
});

// Save log
document.getElementById('saveLogBtn').addEventListener('click',()=>{
  if(!lastResult) return;
  logs.unshift(lastResult);
  if(logs.length>30) logs.pop();
  localStorage.setItem('logs',JSON.stringify(logs));
  showToast('✓ 記録に保存しました');
});

// Rules
function renderRules(){
  const c=document.getElementById('rulesContainer');
  c.innerHTML=rules.map((r,i)=>`
    <div class="rule-card">
      <div class="rule-top">
        <div class="rule-name">${r.name}</div>
        <button class="rule-toggle ${r.enabled?'on':''}" data-i="${i}" aria-label="オン/オフ"></button>
      </div>
      <div class="rule-desc">${r.desc}</div>
      <textarea class="rule-textarea" data-i="${i}" rows="2" ${r.enabled?'':'disabled'}
        placeholder="Claudeへの指示を入力…">${r.prompt}</textarea>
    </div>`).join('');
  c.querySelectorAll('.rule-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{rules[+btn.dataset.i].enabled=!rules[+btn.dataset.i].enabled;renderRules();});
  });
  c.querySelectorAll('.rule-textarea').forEach(ta=>{
    ta.addEventListener('input',()=>{rules[+ta.dataset.i].prompt=ta.value;});
  });
}
renderRules();

// Local answers editor
function renderLocalAnswers(){
  const c=document.getElementById('localAnswersContainer');
  c.innerHTML=modes.map((m,i)=>`
    <div class="local-card">
      <div class="local-card-top">
        <span class="local-icon">${m.icon}</span>
        <span class="local-name">${m.name}</span>
      </div>
      <textarea class="rule-textarea" data-mi="${i}" rows="4"
        placeholder="かんたん回答の内容を入力…">${m.localAnswer||''}</textarea>
    </div>`).join('');
  c.querySelectorAll('textarea').forEach(ta=>{
    ta.addEventListener('input',()=>{modes[+ta.dataset.mi].localAnswer=ta.value;});
  });
}
renderLocalAnswers();

document.getElementById('addRuleBtn').addEventListener('click',()=>{
  rules.push({id:'c'+Date.now(),name:'カスタムルール',desc:'自由に指示を入力',enabled:true,prompt:''});
  renderRules();showToast('ルールを追加しました');
});

document.getElementById('saveRulesBtn').addEventListener('click',()=>{
  localStorage.setItem('rules',JSON.stringify(rules));
  localStorage.setItem('modes',JSON.stringify(modes));
  showToast('✓ 設定を保存しました');
});

// Logs
function renderLogs(){
  const c=document.getElementById('logsContainer');
  if(logs.length===0){c.innerHTML='<div class="log-empty">まだ記録がありません</div>';return;}
  c.innerHTML=logs.map((l,i)=>`
    <div class="log-item">
      <div class="log-item-top">
        <span class="log-mode ${l.type}">${l.type==='local'?'⚡':'🤖'} ${l.mode}</span>
        <span class="log-time">${l.time}</span>
      </div>
      <div class="log-preview">${l.text.substring(0,60)}…</div>
    </div>`).join('');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Default: localモードはボタン有効
document.getElementById('actionBtn').disabled=false;
